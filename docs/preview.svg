<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="DeepRead shows a PDF page on the left, a highlighted passage with its ask bar, and the live conversation on the right">
  <rect x="8" y="8" width="624" height="284" rx="14" fill="#12171d" stroke="#2b3440" stroke-width="1"/>

  <!-- top bar: brand, source switch, page controls, actions -->
  <rect x="28" y="22" width="13" height="13" rx="3" fill="#5f7185"/>
  <rect x="47" y="21" width="62" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <rect x="53" y="25" width="24" height="7" rx="3.5" fill="#6e8194"/>
  <rect x="82" y="25" width="21" height="7" rx="3.5" fill="#3a4652"/>
  <rect x="121" y="21" width="26" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <rect x="159" y="21" width="88" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <rect x="259" y="21" width="34" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <rect x="303" y="21" width="86" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <rect x="430" y="21" width="58" height="15" rx="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <circle cx="512" cy="28.5" r="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <circle cx="536" cy="28.5" r="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <circle cx="560" cy="28.5" r="7.5" fill="#1d252d" stroke="#2f3a46"/>
  <circle cx="596" cy="28.5" r="7.5" fill="#1d252d" stroke="#2f3a46"/>

  <!-- reading pane -->
  <rect x="28" y="48" width="300" height="232" rx="8" fill="#0d1216"/>
  <rect x="42" y="62" width="272" height="204" rx="5" fill="#f7f6f3"/>

  <!-- page heading and body lines -->
  <rect x="60" y="80" width="96" height="12" rx="3" fill="#2c333c"/>
  <rect x="60" y="102" width="236" height="7" rx="3.5" fill="#c9c5bc"/>
  <rect x="60" y="116" width="222" height="7" rx="3.5" fill="#c9c5bc"/>
  <rect x="60" y="130" width="204" height="7" rx="3.5" fill="#c9c5bc"/>

  <!-- highlighted passage -->
  <rect x="58" y="148" width="198" height="13" rx="3" fill="#ffe27a" opacity="0.62"/>
  <rect x="60" y="151" width="184" height="7" rx="3.5" fill="#8a8477"/>
  <rect x="58" y="167" width="150" height="13" rx="3" fill="#ffe27a" opacity="0.62"/>
  <rect x="60" y="170" width="132" height="7" rx="3.5" fill="#8a8477"/>

  <rect x="60" y="190" width="230" height="7" rx="3.5" fill="#c9c5bc"/>
  <rect x="60" y="204" width="214" height="7" rx="3.5" fill="#c9c5bc"/>

  <!-- selection bar: copy, search, ask -->
  <rect x="52" y="226" width="252" height="26" rx="8" fill="#ffffff" stroke="#d8d3c8"/>
  <rect x="64" y="234" width="10" height="10" rx="2" fill="#9aa5b1"/>
  <rect x="80" y="236" width="34" height="6" rx="3" fill="#b9b3a7"/>
  <rect x="126" y="234" width="10" height="10" rx="2" fill="#9aa5b1"/>
  <rect x="142" y="236" width="34" height="6" rx="3" fill="#b9b3a7"/>
  <rect x="196" y="232" width="96" height="14" rx="7" fill="#2f6fd0"/>
  <rect x="212" y="236" width="64" height="6" rx="3" fill="#dbe7fb"/>

  <!-- conversation pane -->
  <rect x="336" y="48" width="276" height="232" rx="8" fill="#0d1216"/>
  <rect x="336" y="48" width="276" height="232" rx="8" fill="none" stroke="#232c36"/>

  <!-- assistant answer with a quoted passage -->
  <rect x="352" y="66" width="196" height="58" rx="10" fill="#1b232b"/>
  <rect x="364" y="74" width="6" height="42" rx="3" fill="#8b6f2a"/>
  <rect x="378" y="78" width="150" height="6" rx="3" fill="#7f8b99"/>
  <rect x="378" y="90" width="132" height="6" rx="3" fill="#7f8b99"/>
  <rect x="378" y="102" width="144" height="6" rx="3" fill="#7f8b99"/>

  <!-- user message -->
  <rect x="418" y="136" width="178" height="34" rx="10" fill="#2f6fd0"/>
  <rect x="432" y="146" width="118" height="6" rx="3" fill="#dbe7fb"/>
  <rect x="432" y="156" width="88" height="6" rx="3" fill="#dbe7fb"/>

  <!-- assistant reply -->
  <rect x="352" y="182" width="212" height="42" rx="10" fill="#1b232b"/>
  <rect x="364" y="192" width="166" height="6" rx="3" fill="#7f8b99"/>
  <rect x="364" y="204" width="140" height="6" rx="3" fill="#7f8b99"/>

  <!-- composer -->
  <rect x="352" y="240" width="244" height="24" rx="9" fill="#161e26" stroke="#2b3440"/>
  <rect x="366" y="249" width="148" height="6" rx="3" fill="#5f7185"/>
  <circle cx="574" cy="252" r="7" fill="#2f6fd0"/>
</svg>
