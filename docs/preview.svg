<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="DeepRead: a PDF page with a highlighted passage on the left, the selection's copy, search and ask buttons, and the highlighted passage quoted in the live conversation on the right">
  <rect x="8" y="8" width="624" height="284" rx="14" fill="#10151a" stroke="#2a3540"/>

  <!-- window bar: brand, source switch, contents / highlights / documents -->
  <g fill="#7d8b9c">
    <rect x="28" y="20" width="6" height="14" rx="2"/>
    <rect x="36" y="20" width="6" height="14" rx="2"/>
    <rect x="49" y="21" width="10" height="12" rx="2"/>
  </g>
  <rect x="68" y="20" width="58" height="16" rx="8" fill="#1b232b" stroke="#2f3a46"/>
  <rect x="74" y="24" width="22" height="8" rx="4" fill="#8b99a8"/>
  <rect x="100" y="24" width="20" height="8" rx="4" fill="#3d4956"/>
  <g stroke="#63707f" stroke-width="2" stroke-linecap="round">
    <rect x="500" y="22" width="14" height="12" rx="2" fill="none"/>
    <path d="M528 22l10 10-6 2-2-6 0 0z" fill="none" stroke-linejoin="round"/>
    <path d="M552 25h16M552 30h16M552 35h16" fill="none"/>
    <rect x="578" y="22" width="13" height="13" rx="2" fill="none"/>
    <rect x="583" y="18" width="13" height="13" rx="2" fill="none"/>
  </g>

  <!-- reading pane -->
  <rect x="24" y="46" width="296" height="238" rx="9" fill="#0b0f13" stroke="#1f2933"/>
  <rect x="36" y="58" width="272" height="214" rx="4" fill="#f7f6f2"/>

  <!-- page tag and heading -->
  <rect x="46" y="70" width="30" height="11" rx="2" fill="#d0534c"/>
  <rect x="46" y="90" width="132" height="11" rx="2" fill="#333b45"/>

  <!-- highlighted passage sits under its text -->
  <rect x="42" y="144" width="256" height="15" rx="3" fill="#f3d36a" opacity="0.72"/>
  <rect x="42" y="162" width="228" height="15" rx="3" fill="#f3d36a" opacity="0.72"/>
  <rect x="42" y="144" width="4" height="33" rx="2" fill="#d8a93b"/>

  <!-- page text -->
  <g fill="#c6c1b6">
    <rect x="46" y="112" width="248" height="6" rx="3"/>
    <rect x="46" y="124" width="232" height="6" rx="3"/>
    <rect x="46" y="136" width="240" height="6" rx="3"/>
    <rect x="50" y="148" width="236" height="6" rx="3" fill="#6f6858"/>
    <rect x="50" y="166" width="204" height="6" rx="3" fill="#6f6858"/>
    <rect x="46" y="200" width="238" height="6" rx="3"/>
    <rect x="46" y="212" width="196" height="6" rx="3"/>
  </g>

  <!-- selection bar: copy, search, ask -->
  <rect x="40" y="230" width="244" height="30" rx="9" fill="#ffffff" stroke="#dcd7cb"/>
  <g stroke="#5f6a78" stroke-width="1.6" fill="none">
    <rect x="54" y="237" width="9" height="11" rx="1.5"/>
    <rect x="57" y="234" width="9" height="11" rx="1.5"/>
    <circle cx="86" cy="241" r="5"/>
    <path d="M90 245l4 4" stroke-linecap="round"/>
  </g>
  <rect x="112" y="233" width="86" height="24" rx="12" fill="#3b82f6"/>
  <path d="M126 240l1.8 4.6 4.6 1.8-4.6 1.8-1.8 4.6-1.8-4.6-4.6-1.8 4.6-1.8z" fill="#eaf2ff"/>
  <rect x="140" y="242" width="44" height="6" rx="3" fill="#dce9fd"/>
  <rect x="208" y="238" width="62" height="14" rx="7" fill="#eef3f9"/>

  <!-- the selection travels to the chat -->
  <path d="M288 232c26-18 36-34 46-52" stroke="#3b82f6" stroke-width="2.6" fill="none" stroke-dasharray="7 5" stroke-linecap="round"/>
  <path d="M330 184l10-9-2 13z" fill="#3b82f6"/>

  <!-- conversation pane -->
  <rect x="336" y="46" width="276" height="238" rx="9" fill="#0b0f13" stroke="#1f2933"/>

  <!-- assistant bubble quoting the passage -->
  <rect x="352" y="62" width="204" height="62" rx="10" fill="#1b232b"/>
  <rect x="364" y="72" width="4" height="42" rx="2" fill="#f3d36a"/>
  <rect x="376" y="76" width="160" height="6" rx="3" fill="#8b99a8"/>
  <rect x="376" y="88" width="140" height="6" rx="3" fill="#8b99a8"/>
  <rect x="376" y="100" width="152" height="6" rx="3" fill="#66717e"/>

  <!-- user asks -->
  <rect x="420" y="136" width="178" height="36" rx="10" fill="#3b82f6"/>
  <rect x="434" y="147" width="132" height="6" rx="3" fill="#dce9fd"/>
  <rect x="434" y="157" width="96" height="6" rx="3" fill="#c3d8fa"/>

  <!-- assistant answers -->
  <rect x="352" y="184" width="214" height="46" rx="10" fill="#1b232b"/>
  <rect x="366" y="194" width="180" height="6" rx="3" fill="#8b99a8"/>
  <rect x="366" y="206" width="150" height="6" rx="3" fill="#66717e"/>

  <!-- composer -->
  <rect x="352" y="242" width="244" height="26" rx="10" fill="#151d25" stroke="#2b3440"/>
  <rect x="366" y="251" width="132" height="7" rx="3.5" fill="#5f7185"/>
  <circle cx="576" cy="255" r="9" fill="#3b82f6"/>
  <path d="M572 255l9-3-4 6z" fill="#eaf2ff"/>
</svg>
